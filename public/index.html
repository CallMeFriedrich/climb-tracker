<!doctype html>
<html lang="de">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Climb Tracker – Dashboard</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="brand" href="index.html">
        <div class="title">Climb Tracker</div>
        <div class="subtitle">Dashboard</div>
      </a>
      <div class="nav">
        <a class="pill" href="topo.html">Topos</a>
        <a class="pill" href="community.html">Community</a>
        <a class="pill" id="myProfileBtn" href="#">Mein Profil</a>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
        <button class="btn btn-ghost" id="backupBtn" type="button" style="display:none;">💾 Backup</button>
        <button class="btn btn-danger" id="resetBtn" type="button" style="display:none;">Admin Reset</button>
      </div>
    </div>

    <!-- Status -->
    <div class="card" style="margin-bottom:12px;">
      <h2>Diese Woche</h2>
      <div class="divider"></div>
      <div id="statusCard"></div>
    </div>

    <!-- Dehn Streak daily check-in (only when enabled & not yet done today) -->
    <div id="dehnCheckinCard"></div>

    <!-- Quick Log (guided, step-by-step) -->
    <div class="card log-card-panel" id="logCardPanel" style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h2>Eintragen</h2>
        <button type="button" class="log-card-close" id="logCardClose" aria-label="Schließen">✕</button>
      </div>
      <div class="divider"></div>

      <form id="logForm" class="form">
        <input type="hidden" name="environment" id="env" value="indoor" />
        <input type="hidden" name="discipline" id="discValue" value="sport" />
        <input type="hidden" name="mode" id="modeValue" value="lead" />
        <input type="hidden" name="ascent_style" id="styleInput" value="" />
        <input type="hidden" name="crag_id" id="cragId" value="" />
        <input type="hidden" name="sector_id" id="sectorId" value="" />
        <input type="hidden" name="route_id" id="routeId" value="" />

        <!-- Step 1: Environment -->
        <div class="field">
          <label class="step-label"><span class="step-num">1</span> Umgebung</label>
          <div class="toggle-group" id="envToggle">
            <button type="button" class="toggle-btn active" data-env="indoor">Indoor</button>
            <button type="button" class="toggle-btn" data-env="outdoor">Outdoor</button>
          </div>
        </div>

        <!-- Step 2: Discipline -->
        <div class="field">
          <label class="step-label"><span class="step-num">2</span> Disziplin</label>
          <div class="toggle-group" id="discToggle"></div>
        </div>

        <!-- Sport: mode lead/toprope -->
        <div class="field" id="modeField" style="display:none;">
          <label>Modus</label>
          <div class="toggle-group" id="modeToggle">
            <button type="button" class="toggle-btn active" data-mode="lead">Lead</button>
            <button type="button" class="toggle-btn" data-mode="toprope">Toprope</button>
          </div>
        </div>

        <!-- Grade -->
        <div class="field" id="gradeField">
          <label for="grade" id="gradeLabel">Schwierigkeit</label>
          <select name="grade" id="grade"></select>
          <div class="grade-chips" id="gradeChips"></div>
        </div>

        <!-- Ascent style (sport + boulder) -->
        <div class="field" id="styleField">
          <label>Begehungsart</label>
          <div class="style-btns" id="styleBtns"></div>
          <p class="style-desc muted" id="styleDesc"></p>
        </div>

        <!-- Attempts stepper (lead RP/PP, toprope TR) -->
        <div class="field" id="attemptsField" style="display:none;">
          <label>Versuche</label>
          <div class="attempts-stepper">
            <button type="button" class="stepper-btn" id="attMinus">−</button>
            <span id="attValue">2</span>
            <button type="button" class="stepper-btn" id="attPlus">+</button>
          </div>
          <input type="hidden" name="attempts" id="attInput" value="2" />
        </div>

        <!-- Location (crag / sector / route) — built per discipline -->
        <div id="locationSection"></div>

        <!-- Sport extras: route length + quickdraws -->
        <div id="sportExtras" style="display:none; gap:12px;" class="form">
          <div class="field">
            <label for="length_m">Routenlänge (m) <span class="opt">optional</span></label>
            <input id="length_m" name="length_m" type="number" min="0" inputmode="numeric" placeholder="z.B. 25" />
          </div>
          <div class="field">
            <label for="quickdraws">Express benötigt <span class="opt">optional</span></label>
            <input id="quickdraws" name="quickdraws" type="number" min="0" inputmode="numeric" placeholder="z.B. 12" />
          </div>
        </div>

        <!-- Alpine section -->
        <div id="alpinSection" style="display:none;"></div>

        <!-- Tension Board extras: board angle + optional Tension-app reference -->
        <div id="tensionSection" style="display:none; gap:12px;" class="form">
          <div class="field">
            <label>Board-Winkel</label>
            <div class="style-btns" id="tensionAnglePresets">
              <button type="button" class="style-btn" data-angle="20">20°</button>
              <button type="button" class="style-btn" data-angle="40">40°</button>
            </div>
            <input id="board_angle" name="board_angle" type="number" min="0" max="90" inputmode="numeric" placeholder="Winkel in ° (z.B. 40)" />
          </div>
          <div class="field">
            <label for="tension_ref">Tension-App: Name / ID / Link <span class="opt">optional</span></label>
            <input id="tension_ref" name="tension_ref" maxlength="300" placeholder="z.B. Boulder-Name oder Link aus der Tension-App" />
          </div>
        </div>

        <!-- Mehr Optionen: count + notes -->
        <span class="expand-link" id="expandExtras">Mehr Optionen</span>
        <div id="extraFields" class="extra-fields">
          <div class="field">
            <label for="count">Anzahl</label>
            <input id="count" name="count" type="number" min="1" value="1" required />
          </div>
          <div class="field">
            <label for="notes">Notiz</label>
            <input id="notes" name="notes" maxlength="500" placeholder="optional" />
          </div>
        </div>

        <button class="btn btn-primary" type="submit" id="submitLog">Speichern</button>
      </form>
    </div>

    <div class="grid cols-2">
      <!-- Progress -->
      <div class="card">
        <h2>Fortschritt</h2>
        <p class="muted">X/Y = geschafft/gesetzt</p>
        <div class="divider"></div>
        <div id="progress" class="list"></div>
      </div>

      <!-- Inline Goals -->
      <div class="card">
        <h2>Ziele bearbeiten</h2>
        <p class="muted">Setze Ziele pro Schwierigkeit</p>
        <div class="divider"></div>
        <div id="inlineGoals"></div>
      </div>

      <!-- Logbook -->
      <div class="card" style="grid-column: 1 / -1;">
        <h2>Logbuch</h2>
        <p class="muted">Letzte 50 Einträge</p>
        <div class="divider"></div>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <button type="button" class="fab" id="mobileLogFab" aria-label="Eintragen">+</button>

  <script src="app.js?v=2026-04-07b"></script>
  <script>
    initDashboard();
  </script>
</body>
</html>
